name: LumenRead
options:
  bundleIdPrefix: com.lumenread
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  LumenRead:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LumenRead
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenread.app
        PRODUCT_NAME: LumenRead
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: LumenRead/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: LumenRead/Info.plist
      properties:
        CFBundleDisplayName: LumenRead
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.idpf.epub-container
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB Document
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
              public.mime-type:
                - application/epub+zip

  LumenReadTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LumenReadTests
    dependencies:
      - target: LumenRead
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

  LumenReadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LumenReadUITests
    dependencies:
      - target: LumenRead
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  LumenRead:
    build:
      targets:
        LumenRead: all
        LumenReadTests: [test]
        LumenReadUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LumenReadTests
        - LumenReadUITests
