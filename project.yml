name: NativRead
options:
  bundleIdPrefix: com.karsai
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  # Supports localisation across four languages.
  knownRegions: [en, es, de, hu, Base]

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  NativRead:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - NativRead
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karsai.nativread
        PRODUCT_NAME: NativRead
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "3.4.0"
        CURRENT_PROJECT_VERSION: "8"
        INFOPLIST_FILE: NativRead/Info.plist
        # Sign in with Apple. Without this the entitlements file is inert and
        # Xcode never requests a profile carrying the capability.
        CODE_SIGN_ENTITLEMENTS: NativRead/NativRead.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: "-lz -lsqlite3"
    info:
      path: NativRead/Info.plist
      properties:
        CFBundleDisplayName: NativRead
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleAllowMixedLocalizations: YES
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Translator backend runs on the user's own LAN over http. Scope ATS to
        # local networking only (never NSAllowsArbitraryLoads). The default URL
        # ships empty: the user must set their backend in Settings, so no
        # attacker-claimable address is baked into the binary.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: NativRead connects to your private translator backend on your local network.
        NativReadDefaultTranslationBackendURL: ""
        # Must match the production backend and the published Privacy Policy.
        # A provider change also requires bumping TranslationPrivacy's consent.
        NativReadAIProviderName: "Google Gemini API"
        # Populate with the final public HTTPS policy before App Store upload.
        # The same complete policy is always readable inside the app.
        NativReadPrivacyPolicyURL: "https://nativread.com/privacy/"
        UIAppFonts:
          - CrimsonPro-VariableFont_wght.ttf
          - CormorantGaramond-VariableFont_wght.ttf
          - CormorantGaramond-Italic-VariableFont_wght.ttf
          - Cinzel-VariableFont_wght.ttf
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB Document
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
              public.mime-type:
                - application/epub+zip

  NativReadTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NativReadTests
    dependencies:
      - target: NativRead
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

  NativReadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NativReadUITests
    dependencies:
      - target: NativRead
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  NativRead:
    build:
      targets:
        NativRead: all
        NativReadTests: [test]
        NativReadUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - NativReadTests
        - NativReadUITests
