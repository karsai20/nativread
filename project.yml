name: Quire
options:
  bundleIdPrefix: com.karsai
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  Quire:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - Quire
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karsai.quire
        PRODUCT_NAME: Quire
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Quire/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Quire/Info.plist
      properties:
        CFBundleDisplayName: Quire
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIAppFonts:
          - CrimsonPro-VariableFont_wght.ttf
          - CormorantGaramond-VariableFont_wght.ttf
          - CormorantGaramond-Italic-VariableFont_wght.ttf
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.idpf.epub-container
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB Document
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
              public.mime-type:
                - application/epub+zip

  QuireTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuireTests
    dependencies:
      - target: Quire
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

  QuireUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuireUITests
    dependencies:
      - target: Quire
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  Quire:
    build:
      targets:
        Quire: all
        QuireTests: [test]
        QuireUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - QuireTests
        - QuireUITests
