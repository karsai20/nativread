name: NativRead
options:
  bundleIdPrefix: com.karsai
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  # Supports localisation across four languages.
  knownRegions: [en, es, de, hu, Base]

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  NativRead:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - NativRead
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karsai.nativread
        PRODUCT_NAME: NativRead
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: NativRead/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: "-lz -lsqlite3"
    info:
      path: NativRead/Info.plist
      properties:
        CFBundleDisplayName: NativRead
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleAllowMixedLocalizations: YES
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIAppFonts:
          - CrimsonPro-VariableFont_wght.ttf
          - CormorantGaramond-VariableFont_wght.ttf
          - CormorantGaramond-Italic-VariableFont_wght.ttf
          - Cinzel-VariableFont_wght.ttf
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.idpf.epub-container
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB Document
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
              public.mime-type:
                - application/epub+zip

  NativReadTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NativReadTests
    dependencies:
      - target: NativRead
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

  NativReadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NativReadUITests
    dependencies:
      - target: NativRead
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  NativRead:
    build:
      targets:
        NativRead: all
        NativReadTests: [test]
        NativReadUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - NativReadTests
        - NativReadUITests
